<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Settings</title>
	<link rel="stylesheet" href="settings.css">
</head>

<body>
	<div class="container">
		<h1>Settings</h1>
		<label for="provider">Provider</label>
		<select id="provider" class="input-select">
			<option value="gemini">Google Gemini</option>
			<option value="openrouter">OpenRouter</option>
		</select>

		<div id="geminiGroup">
			<label for="apiKey">Gemini API Key</label>
			<input type="password" id="apiKey" placeholder="Enter your API key" />
		</div>

		<div id="orGroup" style="display: none;">
			<label for="orApiKey">OpenRouter API Key</label>
			<input type="password" id="orApiKey" placeholder="Enter OpenRouter API key" />
			<label for="orModel">OpenRouter Model</label>
			<input type="text" id="orModel" placeholder="e.g. google/gemini-2.5-flash" />
		</div>

		<label for="keybind">Keybind</label>
		<div class="keybind-wrapper">
			<input type="text" id="keybind" readonly placeholder="Click and press keys..." />
			<button id="resetKeybindBtn" class="btn btn-small" title="Reset to default (Alt+A)">✕</button>
		</div>
		<p class="hint">Click the field and press your desired shortcut</p>
		<div class="checkbox-wrapper">
			<input type="checkbox" id="autoLaunch" />
			<label for="autoLaunch">Launch on startup</label>
		</div>
		<div class="actions">
			<button id="resetBtn" class="btn">Reset Main Window</button>
			<button id="saveBtn" class="btn">Save</button>
		</div>
	</div>
	<script src="settings.js"></script>
</body>

</html>
